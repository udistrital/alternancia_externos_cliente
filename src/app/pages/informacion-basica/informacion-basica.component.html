 <div class="mobile-container" *ngIf="tercero && datosIdentificacion">
  <!-- Encabezado Superior -->
  <header class="app-header">
    
    <div class="header-title">
      <span class="university-text">UNIVERSIDAD DISTRITAL</span>
      <span class="sub-text">FRANCISCO JOSÉ DE CALDAS</span>
    </div>
    
  </header>

  <!-- Contenido Central -->
  <main class="main-content">   



<mat-card class="card-oas" *ngIf="tercero && datosIdentificacion">
    <mat-card-header>
        <!-- <mat-card-title>Terceros</mat-card-title>
        <mat-card-subtitle>Ambiente de pruebas</mat-card-subtitle>
        -->
        <mat-card-title>Información básica</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <mat-grid-list [appOasGridCols]="{xs: 1, sm: 1, md: 1, lg: 1, xl: 1}" rowHeight="40px" gutterSize="10px">
            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Primer nombre</mat-label>
                    <input matInput type="text" value="{{tercero.PrimerNombre}}" disabled>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Segundo nombre</mat-label>
                    <input matInput type="text" value="{{tercero.SegundoNombre}}" disabled>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Primer apellido</mat-label>
                    <input matInput type="text" value="{{tercero.PrimerApellido}}" disabled>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Segundo apellido</mat-label>
                    <input matInput type="text" value="{{tercero.SegundoApellido}}" disabled>
                </mat-form-field>
            </mat-grid-tile>

        </mat-grid-list>
        <br>
        <mat-grid-list [appOasGridCols]="{xs: 1, sm: 1, md: 1, lg: 1, xl: 1}" rowHeight="40px" gutterSize="10px">

            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Tipo de documento</mat-label>
                    <input matInput type="text" value="{{datosIdentificacion.TipoDocumentoId.Nombre}}" disabled>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Número de documento</mat-label>
                    <input matInput type="number" value="{{datosIdentificacion.Numero}}" disabled>
                </mat-form-field>
            </mat-grid-tile>
            
           
        </mat-grid-list>

        <br>
        <mat-grid-list [appOasGridCols]="{xs: 1, sm: 1, md: 1, lg: 1, xl: 1}" rowHeight="40px" gutterSize="10px">
            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Fecha de nacimiento</mat-label>
                    <input matInput type="text" [value]="tercero.FechaNacimiento | date: 'dd/MM/yyyy'" disabled>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile>
                <mat-form-field appearance="fill" [style.width.%]="100">
                    <mat-label>Edad</mat-label>
                    <input matInput type="number" value="{{edad}}" disabled>
                </mat-form-field>
            </mat-grid-tile>
        </mat-grid-list>


    </mat-card-content>
</mat-card>
</main>
